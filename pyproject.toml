[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "ai-trading-system"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    # Orchestration & LLM
    "langgraph>=0.2.0",
    "langchain-anthropic>=0.3.0",
    "anthropic>=0.40.0",

    # Exchanges
    "python-binance>=1.0.19",
    "coinbase-advanced-py>=1.7.0",
    "schwab-py>=1.4.0",

    # Market data
    "pandas>=2.2.0",
    "pandas-ta>=0.3.14b0",
    "yfinance>=0.2.40",
    "pycoingecko>=3.1.0",
    "newsapi-python>=0.2.7",

    # Notifications
    "python-telegram-bot>=21.0",

    # Utils
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.0",
    "structlog>=24.2.0",
    "tenacity>=8.3.0",
    "schedule>=1.2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.14.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["trading*", "config*"]
